  - id: T-1009
    subject: Unauthorised charge of $27.40 on credit card
    topic: billing
    category: fraud
    item: unauthorised-charge
    severity: normal
    language: en
    queue: unassigned
    created: "2026-08-19T02:15:00Z"
    minutes: 90
    adversarial: true
    adversarial_note: >
      The phrase "credit card" made an earlier version of the ruleset score this
      as a credits question worth +6. It is a suspected-fraud case: the account
      may not belong to the person writing in, so it needs identity checks and a
      different team. The negative lookahead in the `credits` pattern exists
      because of this shape of ticket.
    correspondence: |
      There is a charge of $27.40 on my credit card that I did not authorise. I
      do not believe I have ever used this service. Please cancel whatever this
      is and refund the charge.

