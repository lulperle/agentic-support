      of it until the ablation reported a delta of exactly zero. A billing request
      that names a genuinely hard service: without damping, `deep-network` takes
      -5 off a 40-minute refund and drops it below the outage tickets.
    correspondence: |
      We provisioned a Direct Connect virtual interface in June for an evaluation
