# A synthetic support queue, used both as the demo dataset for `queue_triage`
# and as the labelled set that `evals/rank.py` scores against.
#
# WHAT `minutes` IS
#   A hand-set prior: roughly how long I would expect this ticket to take, based
#   on having worked a queue that looks like this. It is not observed data.
#
# WHAT THAT MEANS FOR THE NUMBERS
#   An eval against invented labels cannot tell you the ruleset is accurate. It
#   measures self-consistency against my own prior, and that is worth exactly two
#   things:
#     1. Regression detection. Change a pattern, see whether the ranking moves in
#        the direction you intended, on cases where the intent is unambiguous.
#     2. Ablation. Turn one mechanism off and measure the delta. That claim holds
#        regardless of whether the absolute labels are right, because both arms
#        of the comparison are wrong in the same way.
#   Anything phrased as "this ranker is N% accurate" would be a lie. The harness
#   deliberately does not print such a number.
#
#   Replacing `minutes` with real handling times from a real queue turns this into
#   a genuine measurement. That is the intended upgrade path, and nothing else
#   about the harness has to change.
#
# The tickets are invented. Several are here specifically because the ruleset gets
# them wrong or nearly wrong -- see `adversarial: true`.

