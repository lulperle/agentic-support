[project]
name = "agentic-support"
version = "0.1.0"
description = "A grounded support-triage agent on Google ADK, running on Bedrock or Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.8.0",
    "litellm>=1.100.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
